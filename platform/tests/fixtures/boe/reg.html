<body><h1>اللائحة الاختبارية لنظام اختباري للعمل</h1>
<div class="law-body">
<p>المادة (1):</p><p>تطبق هذه اللائحة على المنشآت الاختبارية.</p>
<p>المادة (2):</p><p>يعد صاحب العمل سجلاً للأجور.</p>
<p>المادة (4):</p><p>تحفظ السجلات خمس سنوات.</p>
