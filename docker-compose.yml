services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - db-data:/var/opt/mssql
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # حساب مخصص بصلاحيات على قاعدة MhdLegal وحدها — أنشئه مرة واحدة بـ deploy/internal/create-app-login.sql
      ConnectionStrings__Default: "Server=db,1433;Database=MhdLegal;User Id=${DB_APP_USER};Password=${DB_APP_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-mhd-legal}
      Jwt__Audience: ${JWT_AUDIENCE:-mhd-legal-client}
      Security__FieldEncryptionKey: ${STORAGE_KEY}
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN}
      Intake__SharedSecret: ${INTAKE_SHARED_SECRET}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASS:-}
      Smtp__From: ${SMTP_FROM:-no-reply@mgrp.sa}
      Seed__ManagerEmail: ${MANAGER_EMAIL}
      Seed__ManagerPassword: ${MANAGER_TEMP_PASSWORD}
    volumes:
      - documents-data:/app/storage/documents
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  documents-data:
