# خادم الموقع العام (www.mgrp.sa) — منفصل تماماً عن خادم النظام الداخلي ولا يتصل بقاعدة بياناته.
# يقدّم الملفات الثابتة، ويمرر /api/intake فقط إلى خادم الاستقبال.

log_format privacy '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

limit_req_zone $binary_remote_addr zone=intake:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mgrp.sa www.mgrp.sa;
    return 301 https://www.mgrp.sa$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mgrp.sa;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    return 301 https://www.mgrp.sa$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mgrp.sa;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # سجلات بلا سلسلة الاستعلام (قد تحوي رقم الطلب)؛ تُدوَّر وتُحذف بعد 30 يوماً (انظر deploy/public/README.md).
    access_log /var/log/nginx/access.log privacy;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    gzip_min_length 1024;

    location = / {
        return 301 /ar/;
    }

    # ملفات مبنية بأسماء تتضمن بصمة المحتوى — تخزين طويل
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /api/intake {
        limit_req zone=intake burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://intake:8080/api/intake;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    error_page 404 /404.html;
}
